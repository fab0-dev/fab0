summary: 'The spec (/Users/zhen/Work/Fab0/fab0/specs/9.md) adds an `Other tasks of this run` section to every per-task stage brief. The section lists each other task''s title, repository and the scenarios it traces to, and it covers single-task runs, tasks with no scenarios, and briefs that stay unchanged (S1-S5). It also requires the implementer to ask only about scenarios no task delivers or about files outside its own task (S6-S8). The task list (/Users/zhen/Work/Fab0/fab0/work/9/tasks.yaml) has two tasks, both in core: T1 changes how fab0-resolve renders the brief and adds tests and the README line, and T2, which depends on T1, updates implementer.md and adds an agent check in scripts/check-agents.py. Whether the gate brief should show the other tasks too is deferred to a separate issue.'
