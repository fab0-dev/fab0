summary: 'The spec (specs/55.md) has 23 scenarios. Within one evaluation the engine
  reads each thing from the tracker at most once. It fetches the run''s item with
  its sub-issues, relations and board fields in one query, and a pull request with
  its reviews and comments in one query. Board-field writes read the board only once
  per command. Independent reads run concurrently, at most 4 at a time. A new `next
  --apply` command applies and hands out from one tracker pass, and `record` makes
  no tracker reads. `/fab0:run` now needs four session turns per round, and a fake
  tracker that logs its calls lets the tests count them. The work is split into four
  tasks: T1 builds the memoized tracker adapter and makes writes do no reads (core).
  T2 makes reads concurrent (core) and T3 adds `next --apply`, the tracker-free `record`
  and the updated run skill (core); both depend on T1, touch different files and can
  run in parallel. T4 updates the commands reference and the page on running a pipeline
  (docs) after T3.'
