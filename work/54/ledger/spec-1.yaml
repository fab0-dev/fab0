summary: 'specs/54.md has 20 scenarios. The engine keeps a log of each run''s events
  on the local machine (hand-outs, results, auto gate decisions, what apply did, and
  units that start waiting on a person or get blocked by a signal). `fab0-resolve
  log <run> [--follow]` prints that log and keeps following it, `/fab0:inbox` shows
  each open run''s latest event, and `/fab0:run` shows the command to follow the run
  from another terminal. The work is split into four tasks: T1 (core) writes the log
  from next, record and apply, with an event schema. After T1, T2 (core) adds the
  log command, --follow, apply''s `follow` field and the run skill change, while T3
  (core) adds the inbox''s latest event in parallel, since the two touch different
  files. T4 (docs), after T2 and T3, documents the log and how to follow a run from
  outside its session.'
