summary: The spec (/Users/zhen/Work/Fab0/fab0/specs/10.md) has nine scenarios for stages with an agent review gate. When an attempt returns questions, the gate doesn't run on it and the questions are posted at once. The task's pull request is then opened, or turned back, as a draft, and its body and the handoff comment say the change is unreviewed and why. Once a later attempt passes the gate, the same pull request is marked ready and its statement updated. If GitHub refuses the draft state, the statement is still written and the run goes on. The work is two core tasks (/Users/zhen/Work/Fab0/fab0/work/10/tasks.yaml). T1 makes fab0-resolve add a `review` object and a `draft` flag to its wait results, and writes the review sentence itself. T2, which depends on T1, changes the github and run skills so /fab0:run sets the draft state, rewrites the pull request body on every update, and puts the same sentence in the handoff comment.
