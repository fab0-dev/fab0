summary: 'The spec (specs/53.md) has 14 scenarios for keeping the person informed
  during a run. Before each round there is a start line per hand-out, with the unit,
  its agent, command or tool, the model, the attempt and the branch. The agents''
  activity shows while they run in parallel, and each recorded unit or gate gets an
  end line with its outcome and duration. After each apply the session lists what
  it did, and the end report gives each unit''s duration. The ledger keeps `started`
  and `ended` so status can report durations later, and the spec covers refused and
  repeated records, entries without times, and the docs. The work splits into four
  tasks: T1 (core) adds the start lines, the times and end lines from record, and
  the new ledger fields; T2 (core) makes status give each unit''s total duration;
  T3 (core) updates the /fab0:run skill so the agents run in the foreground, together,
  and the engine''s lines are shown; T4 (docs) updates the pages on running a pipeline,
  the ledger and the commands.'
