summary: 'The spec (specs/5.md) has seven scenarios. `fab0-resolve --version` prints `{"ok": true, "fab0_version": ...}`, reading the version from the plugin manifest next to the script. Every stage and gate brief carries a `Handed out by fab0 X.` header line, and its result carries a `fab0_version` field. A version that can''t be read is an error for both `--version` and `next`. The commit `/fab0:run` makes for each stage attempt names the release, so the stage PR''s commits show it. A test fails if the version in marketplace.json and the one in plugin.json differ. Ledger recording, version-match checks, PR-body changes and cutting a release are out of scope. The task list (work/5/tasks.yaml) has two core tasks: T1 does the resolver, its tests and the README (S1-S5, S7); T2, which depends on T1, changes the run skill''s commit message (S6).'
