# from fab0-dev/fab0-recipes story--v0.1.0
schema: 1
repos:
  home:    {path: ., github: fab0-dev/fab0, owner: product-owner}
  core:    {path: ../fab0-core, github: fab0-dev/fab0-core, owner: developer, key: CO}
  recipes: {path: ../fab0-recipes, github: fab0-dev/fab0-recipes, owner: developer, key: RC}
people:                                   # roles → GitHub users
  product-owner: {github: [eugenefurs]}   # writes and approves specs; merges delivery PRs
  developer:     {github: [eugenefurs]}   # implements tasks in fab0-core and fab0-recipes
tracker:
  kind: github-projects
  owner: fab0-dev
  project: 1
  fields: {stage: Stage, run: Run, waiting: Waiting on}
pipelines: [story]
models:
  claude-code: {deep: opus, balanced: sonnet, fast: haiku}
profiles:
  cheap: {models: {claude-code: {deep: sonnet}}}
